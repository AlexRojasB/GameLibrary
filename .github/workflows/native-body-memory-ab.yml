name: Native body-count A-B diagnostic

on:
  push:
    branches: [diagnostics/native-body-count-ab-2026-11-23]

# Only synthetic diagnostic work. No changes to PR checks or deployment permissions.
permissions:
  contents: read

concurrency:
  group: native-body-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  body-regressions:
    name: diagnostic-body-regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.201'
      - name: Verify protocol, overlays, privacy and isolation decisions
        run: python3 -B -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Build, then run exact compiled helper regressions without external network
        run: python3 -B tools/ci/native-body-ab.py --regressions --output "$RUNNER_TEMP/body-regression-evidence"
      - name: Preserve sanitized regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-body-regressions-${{ github.run_attempt }}
          path: ${{ runner.temp }}/body-regression-evidence/
          if-no-files-found: error
          retention-days: 14

  trial-block:
    name: diagnostic-body-block-${{ matrix.block }}
    needs: body-regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        block: [1, 2, 3]
    env:
      BUILDX_GIT_INFO: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Execute four alternating full workloads, retaining every failure
        run: python3 -B tools/ci/native-body-ab.py --block '${{ matrix.block }}' --output "$RUNNER_TEMP/native-body-evidence"
      - name: Preserve sanitized success and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-body-block-${{ matrix.block }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-body-evidence/
          if-no-files-found: error
          retention-days: 14
