name: Native memory A-B diagnostic

on:
  push:
    branches: [diagnostics/native-runtime-ab-2026-11-23]

# Dedicated experiment only: no deployment, secrets, environment or PR check changes.
permissions:
  contents: read

concurrency:
  group: native-memory-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trial-block:
    name: diagnostic-block-${{ matrix.block }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        block: [1, 2, 3]
    env:
      BUILDX_GIT_INFO: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify diagnostic and isolation decisions
        run: python3 -B -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Execute four complete native workloads (failures retained, no retries)
        run: python3 -B tools/ci/native-ab.py --block '${{ matrix.block }}' --output "$RUNNER_TEMP/native-ab-evidence"
      - name: Preserve sanitized success and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ab-block-${{ matrix.block }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-ab-evidence/
          if-no-files-found: error
          retention-days: 14
