@if (displaySource(); as src) {
  <img [src]="src" [alt]="alt()" [class]="imageClass()" loading="lazy" (error)="imageFailed($event)" />
} @else {
  <div class="cover-placeholder" [attr.aria-label]="alt()">
    <span role="status">{{ loading() ? 'Loading cover...' : failed() ? 'Cover unavailable' : 'No cover' }}</span>
    @if (failed()) {
      <button type="button" class="button button--ghost" [attr.aria-label]="'Retry ' + alt()" (click)="retry()">Retry cover</button>
      @if (retryMessage()) {
        <small role="status">{{ retryMessage() }}</small>
      }
    }
  </div>
}
