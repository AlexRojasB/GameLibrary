<section class="auth-form">
  <h1>Create an account</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label for="register-email">Email</label>
    <input id="register-email" type="email" formControlName="email" autocomplete="email" required />
    <label for="register-password">Password</label>
    <input id="register-password" type="password" formControlName="password" autocomplete="new-password" required />

    @if (needsEmailConfirmation()) {
      <p class="auth-form__notice" role="status">
        Account created. Check your email to confirm your address before signing in.
      </p>
    }

    @if (error()) {
      <p class="auth-form__error" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>
  </form>

  <p>Already have an account? <a routerLink="/login">Sign in</a></p>
</section>
