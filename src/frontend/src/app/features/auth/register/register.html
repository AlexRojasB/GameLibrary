<section class="auth-form surface-card">
  <p class="eyebrow">Game Library</p>
  <h1>Create an account</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label for="register-email">Email</label>
    <input id="register-email" type="email" formControlName="email" autocomplete="email" required />
    <label for="register-password">Password</label>
    <div class="auth-form__password-field">
      <input id="register-password" [type]="passwordVisible() ? 'text' : 'password'" formControlName="password" autocomplete="new-password" required />
      <button type="button" class="button button--secondary" aria-controls="register-password"
        [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
        (click)="passwordVisible.set(!passwordVisible())">
        <app-password-visibility-icon [visible]="passwordVisible()" />
      </button>
    </div>

    @if (needsEmailConfirmation()) {
      <p class="auth-form__notice" role="status">
        Account created. Check your email to confirm your address before signing in.
      </p>
    }

    @if (error()) {
      <p class="auth-form__error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="button button--primary" [disabled]="submitting()">
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>
  </form>

  <p>Already have an account? <a routerLink="/login">Sign in</a></p>
</section>
