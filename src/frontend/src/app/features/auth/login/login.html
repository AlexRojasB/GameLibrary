<section class="auth-form surface-card">
  <p class="eyebrow">Game Library</p>
  <h1>Sign in</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label for="login-email">Email</label>
    <input id="login-email" type="email" formControlName="email" autocomplete="email" required />
    <label for="login-password">Password</label>
    <div class="auth-form__password-field">
      <input id="login-password" [type]="passwordVisible() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" required />
      <button type="button" class="button button--secondary" aria-controls="login-password"
        (click)="passwordVisible.set(!passwordVisible())">{{ passwordVisible() ? 'Hide password' : 'Show password' }}</button>
    </div>

    @if (error()) {
      <p class="auth-form__error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="button button--primary" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p>No account? <a routerLink="/register">Create one</a></p>
</section>
