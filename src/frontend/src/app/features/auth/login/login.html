<section class="auth-form surface-card">
  <p class="eyebrow">Game Library</p>
  <h1>Sign in</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label for="login-email">Email</label>
    <input id="login-email" type="email" formControlName="email" autocomplete="email" required />
    <label for="login-password">Password</label>
    <input id="login-password" type="password" formControlName="password" autocomplete="current-password" required />

    @if (error()) {
      <p class="auth-form__error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="button button--primary" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p>No account? <a routerLink="/register">Create one</a></p>
</section>
